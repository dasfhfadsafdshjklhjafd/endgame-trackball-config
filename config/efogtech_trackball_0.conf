################################################################################
# This file is split into
#   1) Efog defaults we keep aligned with the upstream board defconfig.
#   2) Piotr´s toggles, grouped by subsystem, with annotations about why they
#      diverge and what parameters control the behavior.
################################################################################

########################
# 1. Efog defaults (keep upstream parity)
########################
# These values match `boards/arm/efogtech_trackball_0/efogtech_trackball_0_defconfig`
# so rewiring them keeps the baseline behavior without surprises.
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_SLEEP=y
# upstream default: 2700000 ms idle window.
CONFIG_ZMK_IDLE_TIMEOUT=2700000
# same as defconfig to let the device fall asleep.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2700000
# default is enabled on the stock board.
CONFIG_ZMK_AXIS_CLAMPER=y
CONFIG_ZMK_AXIS_CLAMPER_HISTORY_TTL=3500

########################
# 2. Piotr's custom toggles
########################

## 2a. Utility modules
# Enable the Pico libc module for extra runtime helpers.
CONFIG_PICOLIBC_USE_MODULE=y
# Build against the pico libc implementation that ships with Zephyr.
CONFIG_PICOLIBC=y

## 2b. BLE / connection tuning
# This block lets us stage fast BLE params while still connecting safely.
# Efog default is y; disable to avoid automatic fast-path until we are ready.
CONFIG_EFOG_SINGLE_SENSOR_BLE_PRESET=n
# Keep hammering hosts for our preferred params even without the preset.
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS=y
# Default y; stay connected so we can keep requesting params.
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_DISCONNECT=n
# `0` makes retries infinite instead of the default 4.
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_MAX_RETRIES=0
# Upstream default is 6; request longer interval while reattaching.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
# Upstream default is 12; widen the acceptable window.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=18
# Default is 30; keep latency disabled to reduce pointer jitter.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Matches efog's tuned timeout.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# Efog's “stable reconnect” min interval.
CONFIG_EFOG_BLE_BASE_MIN_INT=12
# Stable reconnect max interval.
CONFIG_EFOG_BLE_BASE_MAX_INT=18
CONFIG_EFOG_BLE_BASE_LATENCY=0
# Aggressive fast mode interval (1.25 ms units).
CONFIG_EFOG_BLE_FAST_MIN_INT=6
CONFIG_EFOG_BLE_FAST_MAX_INT=12
CONFIG_EFOG_BLE_FAST_LATENCY=0
# Wait 7s before pushing fast params.
CONFIG_EFOG_BLE_FAST_REQUEST_DELAY_MS=7000
# Retry a few times while the link settles instead of the default 2.
CONFIG_EFOG_BLE_FAST_REQUEST_RETRIES=10
# Spacing between retries.
CONFIG_EFOG_BLE_FAST_REQUEST_SPACING_MS=2000
# Keep hammering until the host cooperates.
CONFIG_EFOG_BLE_FAST_RETRY_FOREVER=y
# Disconnect if Windows never lets us back into fast params (~60s with the spacing above).
# CONFIG_EFOG_BLE_FAST_FORCE_DISCONNECT=n
# CONFIG_EFOG_BLE_FAST_FORCE_DISCONNECT_ATTEMPTS=30
# Default 20; smaller queue keeps latency low during fast mode.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=4

## 2c. Pointer / mixer tuning
# This section adjusts the mixer and scroll sensitivities from efog defaults.
# Baseline from efog.
CONFIG_POINTER_2S_MIXER_ENSURE_SYNC=y
# Matches stock.
CONFIG_POINTER_2S_MIXER_REMAINDER_TTL=16
# default 2; leave stock (update comment if you change this).
CONFIG_ZMK_INPUT_PROCESSOR_REPORT_RATE_LIMIT_DEFAULT=2
# upstream default y.
CONFIG_POINTER_2S_MIXER_FEEDBACK_EN=n
# default n; ensure scrolling suspends pointer movement.
CONFIG_POINTER_2S_MIXER_SCROLL_DISABLES_POINTER=y
# default 160; reconfigure if you change this.
CONFIG_POINTER_2S_MIXER_POINTER_AFTER_SCROLL_ACTIVATION=160
# default 500.
CONFIG_POINTER_2S_MIXER_DIRECTION_FILTER_TTL=500
# default 160.
CONFIG_POINTER_2S_MIXER_TWIST_FILTER_TTL=100
# default 25.
CONFIG_POINTER_2S_MIXER_TWIST_FILTER_DEBOUNCE=25
# default 10.
CONFIG_POINTER_2S_MIXER_SIGNIFICANT_MOVEMENT_MUL=10
# default 5.
CONFIG_POINTER_2S_MIXER_DELTA_Y_OVER_TRANS_MAG_MUL=5
# default 10.
CONFIG_POINTER_2S_MIXER_EMA_ALPHA=10

## 2d. Scroll/twist defaults
# default 10; much finer base sensitivity (0.001 units).
CONFIG_EFOG_SCROLL_STEP=1
# default 2; lower floor for minimum sensitivity.
CONFIG_EFOG_SCROLL_MIN_STEP=1
# default 12; keep the upper bound aligned with efog.
CONFIG_EFOG_SCROLL_MAX_STEP=12
# default 1000; start with an extremely low twist coefficient before the mixer adjusts.
CONFIG_EFOG_SCROLL_DEFAULT=50
# same as efog default but kept explicit for clarity.
CONFIG_EFOG_SCROLL_TOGGLE_STEP=30
# default 1.
CONFIG_EFOG_SCROLL_TOGGLE_MIN=1
# default 2.
CONFIG_EFOG_SCROLL_TOGGLE_MAX=2

## 2e. Axis-clamper tuning
# default n; enable the tuned axis clamper parameters below.
CONFIG_EFOG_TRACKBALL_AXIS_CLAMPER_TUNE=n
# default 3; more history while tuning.
CONFIG_EFOG_TRACKBALL_AXIS_CLAMPER_HISTORY=4
# default 2; require a larger deviation before clamping.
CONFIG_EFOG_TRACKBALL_AXIS_CLAMPER_THRESHOLD=3
# default 1; increase hysteresis for smoother recovery.
CONFIG_EFOG_TRACKBALL_AXIS_CLAMPER_HYSTERESIS=2

## 2f. Velocity gate and analog tweaks
# Keep disabled while we evaluate; enable to gate slow movements.
CONFIG_POINTER_2S_MIXER_VEL_GATE_EN=n
# 0.04 counts/ms threshold that would be used when the gate is enabled (default 8).
CONFIG_POINTER_2S_MIXER_VEL_GATE_THR=3
# default 1; no deadzone.
CONFIG_POINTER_2S_MIXER_VEL_GATE_DEADZONE=0

## 2g. Miscellaneous overrides
# Slightly wider trigger window than efog's default (~30).
CONFIG_EC11_ISH_TRIGGER_WINDOW=35
# Slower debounce.
CONFIG_EC11_ISH_DEBOUNCE_MS=60
# default 961; change appearance so the device stands out in BLE lists.
CONFIG_BT_DEVICE_APPEARANCE=962
# Same as efog default; kept explicit so it is easy to change.
CONFIG_EFOG_TRACKBALL_CPI=3200
# CONFIG_NFCT_PINS_AS_GPIOS is not set



