# Keep the sensors de-synced and allow pointer+scroll concurrently.
# Mixer-only tweaks so the single-sensor fallback doesn't wait on the missing sensor.
CONFIG_POINTER_2S_MIXER_ENSURE_SYNC=n
CONFIG_POINTER_2S_MIXER_SCROLL_DISABLES_POINTER=n
CONFIG_POINTER_2S_MIXER_DIRECTION_FILTER_EN=n
CONFIG_POINTER_2S_MIXER_34_FILTER_EN=n
CONFIG_POINTER_2S_MIXER_FEEDBACK_EN=n
CONFIG_POINTER_2S_MIXER_NORMALIZE_SINGLE_SENSOR_TRANSFORM=y

# BLE tuning – keep the latency budget tight and avoid buffering delays.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS=y
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_MAX_INTERVAL=6
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_MAX_LATENCY=0
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_RETRY_MS=500
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_MAX_RETRIES=4
CONFIG_ZMK_BLE_FORCE_CONN_PARAMS_DISCONNECT=y
CONFIG_ZMK_BLE_THREAD_PRIORITY=3
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=1
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=1
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=1
# CONFIG_ZMK_LOG_LEVEL_DBG=y
